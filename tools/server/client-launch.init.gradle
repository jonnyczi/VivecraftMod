// Gradle init script for tools/server/run-player.sh. It adds the task :fabric:writeClientLaunch, which writes what the
// Loom runClient task would launch into -PclientLaunchDir=<dir>, without compiling anything:
//   classpath.txt  runtime classpath without this repo's build outputs, Vivecraft itself is loaded from a jar instead
//   jvm-args.txt   jvm arguments, with the Loom launch.cfg properties inlined, so no devlaunchinjector is needed
//   args.txt       game arguments from launch.cfg (asset index and directory)
// usage: tools/nix-gradle.sh -I tools/server/client-launch.init.gradle :fabric:writeClientLaunch -PclientLaunchDir=<dir>
gradle.beforeProject { p ->
    if (p.path != ':fabric') {
        return
    }
    p.tasks.register('writeClientLaunch') { task ->
        task.doLast {
            def run = p.tasks.getByName('runClient')
            def out = p.file(p.property('clientLaunchDir'))
            out.mkdirs()
            def root = p.rootDir.toPath()

            // the mod itself comes from the built jar, so drop the build outputs of this repo
            def classpath = run.classpath.files.findAll { f ->
                def path = f.toPath()
                !(path.startsWith(root) && root.relativize(path).any { it.toString() == 'build' })
            }

            // the @argfile only holds Loom's -classpath, which is written separately
            def jvmArgs = []
            def dliConfig = null
            run.allJvmArgs.each { arg ->
                if (arg.startsWith('-Dfabric.dli.config=')) {
                    dliConfig = new File(arg.substring('-Dfabric.dli.config='.length()))
                } else if (!arg.startsWith('-Dfabric.dli.') && !arg.startsWith('@')) {
                    jvmArgs << arg
                }
            }

            // launch.cfg has sections without indent and tab indented entries
            def args = []
            if (dliConfig == null || !dliConfig.exists()) {
                throw new GradleException("no Loom launch.cfg found, jvm args: ${run.allJvmArgs}")
            }
            def section = null
            dliConfig.eachLine { line ->
                if (!line.startsWith('\t')) {
                    section = line.trim()
                } else {
                    def value = line.substring(1)
                    if (section in ['commonProperties', 'clientProperties']) {
                        if (value.startsWith('log4j.configurationFile=')) {
                            // keep a copy, the original is regenerated by every build
                            def log4j = new File(out, 'log4j.xml')
                            log4j.text = new File(value.substring('log4j.configurationFile='.length())).text
                            jvmArgs << "-Dlog4j.configurationFile=${log4j.absolutePath}".toString()
                        } else if (!value.startsWith('fabric.classPathGroups=')) {
                            jvmArgs << "-D${value}".toString()
                        }
                    } else if (section in ['commonArgs', 'clientArgs']) {
                        args << value
                    }
                }
            }

            new File(out, 'classpath.txt').text = classpath.collect { it.absolutePath }.join('\n') + '\n'
            new File(out, 'jvm-args.txt').text = jvmArgs.join('\n') + '\n'
            new File(out, 'args.txt').text = (args + run.args).join('\n') + '\n'
            new File(out, 'main-class.txt').text = 'net.fabricmc.loader.impl.launch.knot.KnotClient\n'
            println "client launch written to ${out}"
        }
    }
}
